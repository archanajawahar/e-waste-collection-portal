apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-waste-portal
  labels:
    app: e-waste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: e-waste-portal
  template:
    metadata:
      labels:
        app: e-waste-portal
    spec:
      containers:
        - name: e-waste-portal
          image: archanajawahar14/e-waste-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: e-waste-portal
spec:
  type: NodePort
  selector:
    app: e-waste-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30087
